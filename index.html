<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lectura — Bibliothèque audio</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#F6F5F2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#14151A;-webkit-font-smoothing:antialiased}
  ::selection{background:#4F46E533}
  a{color:#4F46E5}
  a:hover{color:#4338CA}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#D8D8E0;border-radius:8px}
  input::placeholder,textarea::placeholder{color:#9A9AA5}
  select,input,textarea,button{font-family:inherit}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
